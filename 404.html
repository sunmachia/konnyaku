<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ページが見つかりませんでした。">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fff8e8">
  <title>ページが見つかりません｜群馬こんにゃくプロジェクト</title>
  <link rel="icon" href="assets/project-emblem.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/project-emblem.png">
  <link rel="stylesheet" href="assets/brand.css">
  <style>
    main { min-height: calc(100vh - 180px); display: grid; place-items: center; padding-block: 35px; }
    .not-found {
      width: min(100%, 560px);
      padding: 38px 23px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--cream);
      text-align: center;
    }
    .not-found-mark {
      width: 90px;
      height: 90px;
      display: grid;
      place-items: center;
      margin: 0 auto 17px;
      border-radius: 24px;
      background: var(--tomato-soft);
      color: var(--tomato-dark);
      font-size: 34px;
      font-weight: 900;
    }
    .not-found h1 { margin: 0; font-size: 27px; font-weight: 900; }
    .not-found p { margin: 10px 0 21px; color: var(--muted); font-size: 13px; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="top-strip">GUNMA KONNYAKU PROJECT</div>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">
        <img class="brand-stamp" src="assets/project-emblem.png" alt="" aria-hidden="true">
        <span class="brand-copy"><span class="brand-name">群馬こんにゃくプロジェクト</span><span class="brand-sub">樹徳高等学校 2SS1班</span></span>
      </a>
      <a class="button button--white" href="/">トップへ <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main>
    <section class="not-found">
      <span class="not-found-mark" aria-hidden="true">404</span>
      <h1>あれ？ページが見つからない！</h1>
      <p>ページが移動したか、URLが違うみたいです。<br>トップページからもう一度探してみてください。</p>
      <a class="button button--tomato" href="/">トップページへ戻る <span aria-hidden="true">→</span></a>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap footer-note"><span>© 2026 樹徳高等学校 2SS1班</span><span>こんにゃくで、群馬をおいしく。</span></div>
  </footer>
</body>
</html>
